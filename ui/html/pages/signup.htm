{{define "title"}}ثبت‌نام{{end}}

{{define "extra-head"}}
<link rel="stylesheet" href="/static/css/auth.css">
{{end}}

{{define "main"}}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">ثبت‌نام</h1>
        {{if .Error}}
        <div class="error-message">{{.Error}}</div>
        {{end}}
        <form action="/user/signup" method="POST" class="auth-form" novalidate>
            <div class="form-group">
                <label for="first_name">نام</label>
                <input type="text" id="first_name" name="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">نام خانوادگی</label>
                <input type="text" id="last_name" name="last_name" required>
            </div>
            <div class="form-group">
                <label for="email">ایمیل</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary">ثبت‌نام</button>
        </form>
        <div class="auth-footer">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="/user/login">ورود</a>
        </div>
    </div>
</div>
<div id="toast" class="toast"></div>
<script src="/static/js/utils.js"></script>
<script src="/static/js/signup.js"></script>
{{end}}
