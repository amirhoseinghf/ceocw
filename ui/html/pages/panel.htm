{{define "title"}} Panel {{end}}

{{define "main-panel"}}
<div class="panel-container" dir="rtl">
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item active" data-tab="dashboard">
                    <a href="#">
                        <span class="nav-icon">📊</span>
                        <span class="nav-text">پیشخوان</span>
                    </a>
                </li>
                <li class="nav-item" data-tab="teachers">
                    <a href="#">
                        <span class="nav-icon">👨‍🏫</span>
                        <span class="nav-text">اساتید</span>
                    </a>
                </li>
                <!-- future items -->
            </ul>
        </nav>
    </aside>

    <main class="content">
        <!-- Dashboard content (shown by default) -->
        <div id="dashboard-content" class="tab-content active">
            <div class="content-header">
                <h1>پیشخوان</h1>
            </div>
            <div class="content-inner">
                <p>به پنل مدیریت محتوا خوش آمدید!</p>
            </div>
        </div>

        <!-- Teachers content (hidden initially) -->
        <div id="teachers-content" class="tab-content">
            <div class="content-header">
                <h1>مدیریت اساتید</h1>
                <button id="add-teacher-btn" class="btn btn-primary">
                    <span>➕</span> افزودن استاد
                </button>
            </div>
            <div class="content-inner">
                <div id="teachers-list">
                    <!-- Teachers will be loaded here dynamically -->
                    <div class="loading">در حال بارگذاری...</div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal (popup) for add/edit teacher -->
<div id="teacher-modal" class="modal" style="display:none;" dir="rtl">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2 id="modal-title">افزودن استاد جدید</h2>
        <form id="teacher-form">
            <input type="hidden" id="teacher-id" value="0">
            <div class="form-row">
                <div class="form-group">
                    <label>نام</label>
                    <input type="text" id="first-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>نام خانوادگی</label>
                    <input type="text" id="last-name" class="form-control" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>نام (انگلیسی)</label>
                    <input type="text" id="first-name-en" class="form-control">
                </div>
                <div class="form-group">
                    <label>نام خانوادگی (انگلیسی)</label>
                    <input type="text" id="last-name-en" class="form-control">
                </div>
            </div>
            <div class="form-group">
                <label>آدرس تصویر</label>
                <input type="text" id="image-url" class="form-control" placeholder="https://cse.sbu.ac.ir/teacher-img.jpg">
            </div>
            <div class="form-group">
                <label>لینک صفحه</label>
                <input type="text" id="page-url" class="form-control" placeholder="https://cse.sbu.ac.ir/~teacher-id">
            </div>
            <div class="modal-buttons">
                <button type="button" class="btn btn-cancel" id="modal-cancel">لغو</button>
                <button type="submit" class="btn btn-save">ذخیره تغییرات</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/panel.js"></script>
<div id="toast" class="toast"></div>
{{end}}
