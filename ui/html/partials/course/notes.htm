{{define "notes-content"}}
<div class="assignments-section" id="notes-content">
  {{if .Course.Notes}}
    <div class="table-container">
      <table class="assignments-table">
        <thead>
          <tr>
            <th>عنوان</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody>
          {{range .Course.Notes}}
          <tr>
            <td>
              <div class="assignment-title-container">
                {{.Title}}
                {{if .IsUpdated}}<span class="project-badge">آپدیت شده</span>{{end}}
              </div>
            </td>
            <td class="actions-cell">
              <div class="action-buttons">
                <a href="/data/courses/{{$.Course.Id}}/notes/{{.FileName}}" class="download-btn" target="_blank">
                  دانلود
                </a>
              </div>
            </td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
    <div class="mobile-notes-list">
      {{range .Course.Notes}}
      <div class="mobile-assignment-item">
        <div class="mobile-assignment-title">
          {{.Title}}
          {{if .IsUpdated}}<span class="project-badge">آپدیت شده</span>{{end}}
        </div>
        <div class="mobile-assignment-actions">
          <a href="/data/courses/{{$.Course.Id}}/notes/{{.FileName}}" class="download-btn" target="_blank">
            دانلود
          </a>
        </div>
      </div>
      {{end}}
    </div>
  {{else}}
  <div class="no-content-message">
    جزوه ای موجود نیست
  </div>
  {{end}}
</div>
{{end}}
