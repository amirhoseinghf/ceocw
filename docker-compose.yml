services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ceocw
      MYSQL_USER: amirh
      MYSQL_PASSWORD: pass
    ports:
      - "3306:3306"
    volumes:
      - ceocw-mysql-data:/var/lib/mysql
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command:
      - go
      - run
      - ./cmd/web
      - -addr=:4000
      - -dsn=amirh:pass@tcp(db:3306)/ceocw?parseTime=true
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

volumes:
  ceocw-mysql-data:
  go-mod-cache:
  go-build-cache:
